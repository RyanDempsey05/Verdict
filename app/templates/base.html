<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}VERDICT{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Inter:wght@400;500;600&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0b;
      --panel: #121214;
      --panel-2: #0d0d0f;
      --panel-hi: #18181b;
      --line: #26262a;
      --line-hi: #3c3c42;
      --text: #d2d2d7;
      --muted: #76767e;
      --bone: #ededf0;
      --moss: #8f1d2c;
      --moss-hi: #c42638;
      --verd: #e0394d;
      --brass: #e0394d;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 90% 55% at 50% -15%, rgba(196,38,56,.10), transparent),
        radial-gradient(ellipse 70% 50% at 10% 100%, rgba(143,29,44,.07), transparent),
        radial-gradient(ellipse 100% 100% at 50% 50%, transparent 45%, rgba(0,0,0,.55) 100%);
      background-attachment: fixed;
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, sans-serif;
      font-size: .95rem;
      margin: 0;
      padding: 0 1rem 4rem;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 720px; margin: 0 auto; }
    nav {
      display: flex; align-items: center; gap: 1.25rem; flex-wrap: wrap;
      padding: 1.5rem 0 1rem; margin-bottom: 2rem;
      border-bottom: 1px solid var(--line);
    }
    .brand {
      font-family: Cinzel, serif; font-weight: 600;
      font-size: 1.45rem; letter-spacing: .22em;
      color: var(--bone); text-decoration: none; margin-right: auto;
    }
    .brand span { color: var(--verd); }
    nav a {
      color: var(--muted); text-decoration: none;
      font-family: Inter, sans-serif; font-size: .82rem; font-weight: 500;
      letter-spacing: .02em;
    }
    nav a:hover { color: var(--bone); }
    .who {
      color: #65656d; font-size: .82rem;
      font-family: Inter, sans-serif;
    }
    h1 {
      font-family: Cinzel, serif; font-weight: 400;
      font-size: 1.9rem; letter-spacing: .04em;
      margin: 0 0 1.75rem; color: var(--bone);
      padding-bottom: .6rem;
      border-bottom: 1px solid var(--line);
    }
    h2 { font-family: Cinzel, serif; font-weight: 500; color: var(--bone); letter-spacing: .02em; }
    html { scroll-behavior: smooth; }
    .card { scroll-margin-top: 2rem;
      background: linear-gradient(180deg, var(--panel), var(--panel-2));
      border: 1px solid var(--line);
      border-radius: 2px;
      padding: 1rem;
      margin-bottom: .9rem;
      display: flex; gap: 1rem;
      box-shadow: 0 1px 0 rgba(255,255,255,.02) inset, 0 3px 14px rgba(0,0,0,.55);
      transition: border-color .2s;
    }
    .card:hover { border-color: var(--line-hi); }
    .card img {
      width: 74px; border-radius: 1px; flex-shrink: 0; align-self: flex-start;
      border: 1px solid #232327;
      filter: saturate(.55) contrast(.95) brightness(.88);
    }
    .card:hover img { filter: saturate(.75) contrast(1) brightness(.95); }
    .card-body { flex: 1; min-width: 0; }
    .title { font-weight: 500; font-size: 1.15rem; color: var(--bone); }
    .year { color: #6a6a72; font-weight: 400; }
    .meta { color: var(--muted); font-size: .9rem; margin-top: .25rem; }
    .review {
      margin-top: .65rem; padding-left: .9rem;
      border-left: 2px solid var(--moss);
      color: #a0a0a8; font-family: 'EB Garamond', Georgia, serif;
      font-size: 1.02rem; font-style: italic;
    }
    .score {
      display: inline-block; font-family: Cinzel, serif; font-weight: 600;
      font-size: 1.2rem; color: var(--brass);
    }
    input, select, textarea {
      background: var(--panel-hi); color: var(--text);
      border: 1px solid var(--line); border-radius: 1px;
      padding: .6rem .75rem; font-family: Inter, sans-serif;
      width: 100%; max-width: 100%;
    }
    input:focus, select:focus { outline: none; border-color: var(--verd); }
    input::placeholder { color: #5a5a62; font-style: italic; }
    button {
      background: linear-gradient(180deg, var(--moss-hi), var(--moss));
      color: #f2eaea; border: 1px solid #5e1620; border-radius: 1px;
      padding: .55rem 1.15rem;
      font-family: Inter, sans-serif; font-size: .85rem; font-weight: 600;
      letter-spacing: .01em;
      cursor: pointer; transition: filter .15s;
    }
    button:hover { filter: brightness(1.18); }
    button.ghost {
      background: transparent; border: 1px solid var(--line); color: #6e6e76;
      padding: .35rem .75rem; font-size: .8rem; font-weight: 500;
    }
    button.ghost:hover { border-color: var(--verd); color: var(--bone); filter: none; }
    .row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
    .row input { flex: 1; min-width: 140px; width: auto; }
    .row button { flex-shrink: 0; }
    .stack > * { margin-bottom: .75rem; }
    .err {
      background: rgba(196,38,56,.13); border: 1px solid #7a2530;
      color: #e08a8a; padding: .7rem 1rem; border-radius: 1px; margin-bottom: 1.25rem;
      font-style: italic;
    }
    .empty {
      color: #6e6e76; text-align: center; padding: 3rem 1rem;
      border: 1px solid var(--line); border-radius: 1px; font-style: italic;
      background: rgba(13,13,15,.55);
    }
    .following { color: var(--muted); font-size: .92rem; margin: 1rem 0 2rem; }
    .following b { color: var(--bone); font-weight: 500; }
    form.inline { display: inline; }
    .auth { max-width: 380px; margin: 3rem auto; }
    .tag {
      font-family: Inter, sans-serif; font-size: .68rem; font-weight: 500;
      text-transform: uppercase; letter-spacing: .06em;
      color: #6e6e76; border: 1px solid var(--line);
      padding: .15rem .45rem; border-radius: 1px;
    }
    .tabs { display: flex; gap: .4rem; margin-bottom: 1.75rem; flex-wrap: wrap; }
    .tab {
      display: inline-flex; align-items: center; gap: .4rem;
      padding: .4rem .9rem; border-radius: 1px;
      border: 1px solid var(--line); background: var(--panel);
      color: var(--muted); text-decoration: none;
      font-family: Inter, sans-serif; font-size: .8rem; font-weight: 500;
      letter-spacing: .01em;
      transition: all .15s; cursor: pointer;
    }
    .tab:hover { border-color: var(--line-hi); color: var(--bone); }
    .tab.on {
      background: linear-gradient(180deg, var(--moss-hi), var(--moss));
      border-color: #5e1620; color: #f2eaea;
    }
    .tab span { font-size: .68rem; opacity: .7; }
    .sortbar { margin: -.75rem 0 1.5rem; }
    .sortbar select {
      width: auto; padding: .35rem .7rem; font-size: .9rem;
      color: var(--muted); border-radius: 1px; cursor: pointer;
    }
    .sortbar select:hover { color: var(--text); }
    .pickgrid {
      display: grid; gap: .8rem;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    }
    .pick {
      border: 1px solid var(--line); border-radius: 2px;
      padding: .4rem; background: var(--panel);
      transition: border-color .15s;
    }
    .pick.picked { border-color: var(--moss-hi); background: rgba(74,92,57,.12); }
    .pick img {
      width: 100%; display: block; border-radius: 1px;
      filter: saturate(.5) brightness(.8);
    }
    .pick.picked img { filter: saturate(.9) brightness(1); }
    .pick-noimg {
      height: 150px; display: flex; align-items: center; justify-content: center;
      text-align: center; font-size: .75rem; color: var(--muted);
      background: var(--panel-hi); padding: .4rem;
    }
    .pick-title {
      font-size: .72rem; color: var(--muted); margin: .35rem 0 .3rem;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .pick-ranks { display: flex; gap: .18rem; }
    .rankbtn {
      flex: 1; padding: .18rem 0; font-size: .65rem; letter-spacing: 0;
      background: transparent; border: 1px solid var(--line); color: #6e6e76;
    }
    .rankbtn:hover { border-color: var(--verd); color: var(--bone); filter: none; }
    .rankbtn.on {
      background: linear-gradient(180deg, var(--moss-hi), var(--moss));
      border-color: #5e1620; color: #f2eaea;
    }
    @media (max-width: 480px) {
      h1 { font-size: 1.55rem; }
      .card img { width: 58px; }
      nav { gap: .85rem; }
      body { font-size: 1rem; }
    }
    .rate { display:flex; align-items:center; gap:.7rem; flex:1 1 200px; min-width:180px; }
    .rateface { width:36px; height:36px; flex-shrink:0; }
    .rateface circle { fill:none; stroke:var(--line-hi); stroke-width:2; transition:stroke .15s; }
    .rateface .fe { fill:var(--muted); transition:fill .15s; }
    .rateface .fm { fill:none; stroke:var(--muted); stroke-width:2.2; stroke-linecap:round; transition:stroke .15s; }
    .rate.on .rateface circle { stroke:currentColor; }
    .rate.on .rateface .fe { fill:currentColor; }
    .rate.on .rateface .fm { stroke:currentColor; }
    .rate.on .ratenum { color:currentColor; }
    .ratetrack {
      position:relative; flex:1; height:30px; cursor:pointer;
      border:1px solid var(--line); border-radius:3px;
      background:var(--panel-hi); overflow:hidden; touch-action:none; min-width:100px;
    }
    .ratefill {
      position:absolute; top:0; bottom:0; left:0; width:0;
      background:var(--moss-hi);
      transition:width .05s linear, background-color .08s linear; pointer-events:none;
    }
    .ratetrack::after {
      content:""; position:absolute; top:0; right:0; bottom:0; left:0; pointer-events:none;
      background:repeating-linear-gradient(90deg,transparent 0 calc(20% - 1px),rgba(0,0,0,.45) calc(20% - 1px) 20%);
    }
    .ratenum {
      font-family:Cinzel,serif; font-weight:600; font-size:1.05rem;
      color:var(--brass); min-width:2rem; text-align:right; flex-shrink:0;
    }
    @media (max-width:720px) { .ratetrack { height:38px; } .rateface { width:32px; height:32px; } }
    a, a:visited { color:var(--verd); text-decoration:none; }
    a:hover { text-decoration:underline; }
    a.cardlink, a.cardlink:visited, a.cardlink:hover {
      color:inherit; text-decoration:none; display:block;
    }
    a.cardlink .title, a.cardlink .year { color:inherit; }
    a.cardlink:hover .title { color:var(--verd); }
    .onboard {
      border:1px solid var(--line); border-left:3px solid var(--moss-hi);
      background:var(--panel); border-radius:3px; padding:1.1rem 1.25rem;
      margin-bottom:1.75rem;
    }
    .onboard h3 {
      font-family:Cinzel,serif; font-weight:500; font-size:1.1rem;
      color:var(--bone); margin:0 0 .4rem; letter-spacing:.02em;
    }
    .onboard p { margin:0 0 .9rem; color:var(--muted); font-size:.95rem; }
    .pips { display:flex; gap:.35rem; align-items:center; }
    .pip {
      width:26px; height:6px; border-radius:2px; background:var(--line);
    }
    .pip.on { background:var(--moss-hi); }
    .pips .left { margin-left:.6rem; font-size:.85rem; color:var(--muted); }
    .cattiles {
      display:grid; gap:1rem; margin-bottom:2.5rem;
      grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
    }
    a.cattile {
      display:block; text-decoration:none; border:1px solid var(--line);
      border-radius:3px; overflow:hidden; background:var(--panel);
      transition:border-color .15s;
    }
    a.cattile:hover { border-color:var(--moss-hi); text-decoration:none; }
    .catgrid {
      display:grid; grid-template-columns:1fr 1fr; gap:1px;
      background:var(--line); aspect-ratio:3/2;
    }
    .catgrid div {
      background:var(--panel-2) center/cover no-repeat;
    }
    .cattile span {
      display:block; padding:.6rem .75rem; color:var(--text);
      font-size:.92rem; font-weight:500; border-top:1px solid var(--line);
    }
    a.cattile:hover span { color:var(--bone); }
    @media (max-width:720px) {
      .cattiles { grid-template-columns:1fr 1fr; gap:.75rem; }
      .cattile span { font-size:.85rem; padding:.5rem .6rem; }
    }
    .pichead {
      position:relative; margin:-1rem -1rem 1.5rem; height:180px;
      overflow:hidden; border-bottom:1px solid var(--line); background:var(--panel-2);
    }
    .pichead img {
      width:100%; height:100%; object-fit:cover; filter:saturate(.6) brightness(.7);
      display:block;
    }
    .picav {
      position:relative; width:84px; height:84px; flex-shrink:0;
      border:1px solid var(--line); border-radius:2px; overflow:hidden;
      background:var(--panel-2);
    }
    .picav img { width:100%; height:100%; object-fit:cover; display:block; }
    .pichint {
      position:absolute; inset:0; display:flex; align-items:center;
      justify-content:center; text-align:center; padding:.4rem;
      font-size:.78rem; color:var(--muted); background:rgba(10,10,11,.55);
      opacity:0; transition:opacity .15s; pointer-events:none;
    }
    .pichead.editable, .picav.editable { cursor:pointer; }
    .pichead.editable:hover .pichint, .picav.editable:hover .pichint { opacity:1; }
    .pichead.editable:not(:has(img)) .pichint,
    .picav.editable:not(:has(img)) .pichint { opacity:1; }
    @media (hover:none) {
      .pichead.editable .pichint, .picav.editable .pichint { opacity:1; }
    }
    @media (max-width:720px) { .pichead { height:130px; margin:-1rem -.85rem 1.25rem; } }
  </style>
  <meta property="og:site_name" content="Verdict">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{% block og_title %}Verdict{% endblock %}">
  <meta property="og:description" content="{% block og_desc %}Rate films, shows, and games. Build your library of favorites.{% endblock %}">
  <meta property="og:image" content="https://verdictapp.app/media/og-default.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#0a0a0b">
</head>
<body>
<div class="wrap">
<nav>
  <a class="brand" href="/">VER<span>DICT</span></a>
  {% if user %}
    <a href="/">Discover</a>
    <a href="/feed">Feed</a>
    <a href="/search">Search</a>
    <a href="/friends">Friends</a>
    <a href="/u/{{ user.username }}">Mine</a>
    <a href="/settings">Settings</a>
    <form class="inline" method="post" action="/ui/logout">
      <button class="ghost" type="submit">Log out</button>
    </form>
  {% else %}
    <a href="/">Discover</a>
    <a href="/search">Search</a>
    <a href="/login">Log in</a>
    <a href="/register">Register</a>
  {% endif %}
</nav>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
{% block content %}{% endblock %}
</div>
<script>
(function () {
  var MOUTHS = {
    1: "M13 28 Q20 21 27 28",
    2: "M13 27 Q20 23 27 27",
    3: "M13 26 L27 26",
    4: "M13 24 Q20 29 27 24",
    5: "M13 23 Q20 32 27 23"
  };

  function band(v) {
    if (v <= 1) return 1;
    if (v <= 2) return 2;
    if (v <= 3.5) return 3;
    if (v <= 4.5) return 4;
    return 5;
  }

  function ramp(v) {
    var lo = [143, 29, 44], hi = [230, 176, 74];
    var t = Math.max(0, Math.min(1, (v - 0.5) / 4.5));
    var c = lo.map(function (a, i) { return Math.round(a + (hi[i] - a) * t); });
    return 'rgb(' + c.join(',') + ')';
  }

  function paint(rate, v, commit) {
    var fill = rate.querySelector('.ratefill');
    var num = rate.querySelector('.ratenum');
    var mouth = rate.querySelector('.fm');
    var eyes = rate.querySelectorAll('.fe');
    var col = ramp(v);
    fill.style.backgroundColor = col;
    rate.style.color = col;
    fill.style.width = (v / 5 * 100) + '%';
    num.textContent = v ? v.toFixed(1) : '0';
    mouth.setAttribute('d', MOUTHS[band(v)] || MOUTHS[3]);
    rate.classList.toggle('on', v > 0);
    var big = v >= 4.5;
    eyes.forEach(function (e) {
      e.setAttribute('rx', big ? 3.0 : 2.1);
      e.setAttribute('ry', big ? 3.3 : 2.6);
    });
    if (commit) rate.querySelector('input[name=score]').value = v.toFixed(1);
  }

  function valueFrom(track, x) {
    var r = track.getBoundingClientRect();
    var pct = Math.max(0, Math.min(1, (x - r.left) / r.width));
    return Math.max(0.5, Math.min(5, Math.ceil(pct * 10) / 2));
  }

  function init(root) {
  (root || document).querySelectorAll('[data-rate]').forEach(function (rate) {
    var track = rate.querySelector('[data-track]');
    var input = rate.querySelector('input[name=score]');
    var dragging = false;
    paint(rate, parseFloat(input.value) || 0, false);

    function at(e, commit) {
      var x = e.clientX;
      if (x === undefined && e.touches && e.touches[0]) x = e.touches[0].clientX;
      if (x === undefined) return;
      paint(rate, valueFrom(track, x), commit);
    }

    track.addEventListener('pointerdown', function (e) {
      dragging = true;
      try { track.setPointerCapture(e.pointerId); } catch (err) {}
      at(e, true);
      e.preventDefault();
    });
    track.addEventListener('pointermove', function (e) { at(e, dragging); });
    track.addEventListener('pointerup', function () { dragging = false; });
    track.addEventListener('pointercancel', function () { dragging = false; });
    track.addEventListener('pointerleave', function () {
      if (!dragging) paint(rate, parseFloat(input.value) || 0, false);
    });
  });
  }
  window.initRates = init;
  init(document);
})();
</script>
</body>
</html>
